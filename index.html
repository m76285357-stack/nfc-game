<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a90e2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>🎪 益智游乐场</title>
<style>
  :root{
    --blue:#4a90e2;
    --pink:#ff6b9d;
    --orange:#ff8c42;
    --green:#4ecb71;
    --purple:#9b6bff;
    --yellow:#ffd23f;
    --ink:#3a3a5c;
    --card:#ffffff;
    --shadow:0 6px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:linear-gradient(160deg,#aee3ff 0%,#d9f2ff 40%,#ffe0f0 100%);
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  .bubble{position:fixed;border-radius:50%;opacity:.35;pointer-events:none;z-index:0;animation:floaty 8s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-24px) rotate(12deg)}}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:999;}

  #app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 16px 40px;}

  #topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  #btn-home{background:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;}
  #btn-home:active{transform:scale(.9);}
  #star-badge{background:#fff;border-radius:999px;padding:8px 16px;font-size:18px;font-weight:bold;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;}

  .screen{display:none;animation:pop .35s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}

  /* 菜单 */
  .title{text-align:center;font-size:40px;margin:10px 0 2px;text-shadow:2px 2px 0 rgba(255,255,255,.7);}
  .subtitle{text-align:center;font-size:17px;margin:0 0 22px;color:#5b5b7a;}
  .game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .game-card{border:none;border-radius:22px;padding:24px 12px;cursor:pointer;color:#fff;font-size:20px;font-weight:bold;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s, box-shadow .15s;text-align:center;line-height:1.4;}
  .game-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .game-card .icon{display:block;font-size:46px;margin-bottom:8px;}
  .game-card .desc{display:block;font-size:13px;font-weight:normal;opacity:.92;margin-top:6px;}
  .card-orange{background:linear-gradient(135deg,#ff8c42,#ffb066);}
  .card-pink{background:linear-gradient(135deg,#ff6b9d,#ff8fb5);}
  .card-blue{background:linear-gradient(135deg,#4a90e2,#6bb1ff);}
  .card-green{background:linear-gradient(135deg,#35b96a,#6fd89b);}
  .card-purple{background:linear-gradient(135deg,#9b6bff,#b693ff);}
  .card-full{grid-column:span 2;}

  .game-title{text-align:center;font-size:26px;margin:4px 0 14px;font-weight:bold;}
  .tip{text-align:center;font-size:14px;color:#6b6b8a;margin:14px 0 0;}
  .game-hud{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:10px 16px;margin-bottom:16px;font-size:16px;font-weight:bold;box-shadow:var(--shadow);}
  .hud-pill{background:#f3f6ff;border-radius:999px;padding:6px 12px;}

  /* 打地鼠 */
  .mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:420px;margin:0 auto;}
  .mole-hole{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 50% 30%, #e0b27c, #8a5a2b);box-shadow:inset 0 8px 14px rgba(0,0,0,.35), 0 4px 0 rgba(0,0,0,.15);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding:0;}
  .mole-hole .animal{font-size:58px;line-height:1;transform:translateY(60%) scale(.6);opacity:0;transition:transform .12s, opacity .12s;}
  .mole-hole.up .animal{transform:translateY(0) scale(1);opacity:1;}
  .mole-hole.up{box-shadow:inset 0 4px 8px rgba(0,0,0,.3), 0 0 0 4px #fff8;}

  /* 记忆翻牌 */
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:900px;}
  .card{aspect-ratio:1;cursor:pointer;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;}
  .card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg);}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .card-back{background:linear-gradient(135deg,#9b6bff,#c29bff);font-size:30px;color:#fff;}
  .card-front{background:#fff;transform:rotateY(180deg);font-size:40px;border:3px solid #e8ecf8;}
  .card.matched .card-front{background:#eafff1;border-color:var(--green);animation:pulse .5s;}
  @keyframes pulse{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(180deg) scale(1)}}

  /* 灯光记忆 */
  .simon-pad{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:320px;margin:0 auto;}
  .simon-btn{aspect-ratio:1;border-radius:20px;border:none;cursor:pointer;transition:filter .12s, transform .12s;box-shadow:var(--shadow);}
  .simon-btn:active{transform:scale(.94);}
  .s-red{background:#ff5f5f;} .s-green{background:#4ecb71;} .s-blue{background:#4a90e2;} .s-yellow{background:#ffd23f;}
  .simon-btn.on{filter:brightness(1.7) saturate(1.4);box-shadow:0 0 26px rgba(255,255,255,.95);}

  /* 接水果 */
  #catch-wrap{max-width:360px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(#bde7ff,#fff3d6);}
  #catch-canvas{display:block;width:100%;height:auto;touch-action:none;}
  .catch-controls{display:flex;gap:16px;justify-content:center;margin-top:14px;}
  .ctl-btn{width:96px;height:58px;font-size:26px;border:none;border-radius:14px;background:#fff;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);}
  .ctl-btn:active{transform:scale(.93);}

  /* 结算 */
  .result-card{background:#fff;border-radius:28px;padding:36px 24px;text-align:center;box-shadow:var(--shadow);}
  .result-emoji{font-size:70px;margin:0;}
  .result-stars{font-size:46px;margin:10px 0;letter-spacing:6px;}
  .result-stars .off{filter:grayscale(1);opacity:.3;}
  .result-msg{font-size:20px;margin:6px 0 26px;color:#5b5b7a;}
  .btn-big{display:block;width:100%;border:none;border-radius:16px;padding:16px;margin:10px 0;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s;}
  .btn-big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .btn-primary{background:linear-gradient(135deg,#ff8c42,#ffa766);}
  .btn-ghost{background:#eef1f8;color:var(--ink);}

  @media (max-width:480px){
    .title{font-size:32px;}
    .card-front{font-size:30px;}
    .mole-hole .animal{font-size:46px;}
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div id="app">
  <div id="topbar">
    <button id="btn-home" title="返回主页">🏠</button>
    <div id="star-badge">⭐ <span id="totalStars">0</span></div>
  </div>

  <!-- 菜单 -->
  <section id="screen-menu" class="screen active">
    <h1 class="title">🎪 益智游乐场</h1>
    <p class="subtitle">选一个好玩的小游戏，开开心心玩起来！</p>
    <div class="game-grid">
      <button class="game-card card-orange" data-game="mole">
        <span class="icon">🔨</span>打地鼠
        <span class="desc">眼疾手快，锤出高分</span>
      </button>
      <button class="game-card card-pink" data-game="memory">
        <span class="icon">🃏</span>记忆翻牌
        <span class="desc">找到相同的动物朋友</span>
      </button>
      <button class="game-card card-blue" data-game="simon">
        <span class="icon">🎵</span>灯光记忆
        <span class="desc">记住灯光亮起的顺序</span>
      </button>
      <button class="game-card card-green" data-game="catch">
        <span class="icon">🍎</span>接水果
        <span class="desc">接住水果，躲开炸弹</span>
      </button>
      <button class="game-card card-purple card-full" data-game="random">
        <span class="icon">🎲</span>随机冒险
        <span class="desc">闭上眼睛，来点惊喜吧！</span>
      </button>
    </div>
  </section>

  <!-- 打地鼠 -->
  <section id="screen-mole" class="screen">
    <div class="game-title">🔨 打地鼠</div>
    <div class="game-hud">
      <span class="hud-pill">⏱ <span id="mole-time">30</span> 秒</span>
      <span class="hud-pill">得分 <span id="mole-score">0</span></span>
    </div>
    <div id="mole-grid" class="mole-grid"></div>
    <p class="tip">快点击冒出来的地鼠！⭐ 金色地鼠有 3 分哦</p>
  </section>

  <!-- 记忆翻牌 -->
  <section id="screen-memory" class="screen">
    <div class="game-title">🃏 记忆翻牌</div>
    <div class="game-hud">
      <span class="hud-pill">⏱ <span id="mem-time">0</span> 秒</span>
      <span class="hud-pill">翻牌 <span id="mem-moves">0</span> 次</span>
    </div>
    <p class="tip">翻开两张一样的动物卡片就能消除，找出所有配对！</p>
    <div id="memory-grid" class="memory-grid"></div>
  </section>

  <!-- 灯光记忆 -->
  <section id="screen-simon" class="screen">
    <div class="game-title">🎵 灯光记忆</div>
    <div class="game-hud">
      <span class="hud-pill">关卡 <span id="simon-level">1</span></span>
      <span id="simon-status" class="hud-pill">准备开始</span>
    </div>
    <div id="simon-pad" class="simon-pad">
      <button class="simon-btn s-red" data-i="0"></button>
      <button class="simon-btn s-green" data-i="1"></button>
      <button class="simon-btn s-blue" data-i="2"></button>
      <button class="simon-btn s-yellow" data-i="3"></button>
    </div>
    <p class="tip">记住灯光亮起的顺序，然后按同样的顺序点一遍</p>
  </section>

  <!-- 接水果 -->
  <section id="screen-catch" class="screen">
    <div class="game-title">🍎 接水果</div>
    <div class="game-hud">
      <span class="hud-pill">⏱ <span id="catch-time">30</span> 秒</span>
      <span class="hud-pill">得分 <span id="catch-score">0</span></span>
      <span class="hud-pill">❤️ <span id="catch-lives">3</span></span>
    </div>
    <div id="catch-wrap"><canvas id="catch-canvas" width="360" height="480"></canvas></div>
    <div class="catch-controls">
      <button id="catch-left" class="ctl-btn">◀</button>
      <button id="catch-right" class="ctl-btn">▶</button>
    </div>
    <p class="tip">接住水果得 1 分，躲开炸弹！手指拖动篮子或用左右按钮</p>
  </section>

  <!-- 结算 -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <p class="result-emoji" id="result-emoji">🎉</p>
      <div class="result-stars" id="result-stars"></div>
      <p class="result-msg" id="result-msg"></p>
      <button class="btn-big btn-primary" id="btn-replay">🔄 再玩一次</button>
      <button class="btn-big btn-ghost" id="btn-result-home">🏠 返回主页</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ===== 小工具 ===== */
  const $ = id => document.getElementById(id);
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=randInt(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  const PRAISES = ["太棒了！🌟","真厉害！","好棒呀！","你真棒！","了不起！","真开心！"];

  const state = {
    screen:"menu",
    totalStars:0,
    currentGame:null,
    timers:[],
    raf:null,
  };

  /* ===== 定时器管理（切换游戏时统一清理） ===== */
  function setT(fn, ms){ const id=setTimeout(fn, ms); state.timers.push(id); return id; }
  function setI(fn, ms){ const id=setInterval(fn, ms); state.timers.push(id); return id; }
  function resetRuntime(){
    if(state.raf){ cancelAnimationFrame(state.raf); state.raf=null; }
    state.timers.forEach(t=>{ clearInterval(t); clearTimeout(t); });
    state.timers=[];
  }

  /* ===== 音效 ===== */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); }
  }
  function beep(freq,dur,type,vol,when){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=vol==null?0.2:vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t=audioCtx.currentTime+(when||0);
    o.start(t); o.stop(t+dur);
  }
  const sfx = {
    click(){ ensureAudio(); beep(600,.08,"triangle",.15); },
    pop(){ ensureAudio(); beep(720,.07,"square",.15); },
    gold(){ ensureAudio(); beep(880,.08,"sine",.2); beep(1320,.12,"sine",.2,.08); },
    flip(){ ensureAudio(); beep(400,.06,"triangle",.12); },
    match(){ ensureAudio(); beep(660,.1,"sine",.2); beep(880,.15,"sine",.2,.1); },
    catch(){ ensureAudio(); beep(700,.08,"sine",.18); beep(1000,.1,"sine",.18,.07); },
    bomb(){ ensureAudio(); beep(200,.28,"sawtooth",.14); },
    tone(f){ ensureAudio(); beep(f,.28,"sine",.22); },
    gameover(){ ensureAudio(); [400,330,262,196].forEach((f,i)=>beep(f,.2,"sine",.2,i*.14)); },
    win(){ ensureAudio(); [523,659,784,1047].forEach((f,i)=>beep(f,.18,"sine",.22,i*.12)); },
  };

  /* ===== 撒花 ===== */
  const cvs=$("confetti"), ctx=cvs.getContext("2d");
  let parts=[], confettiRunning=false;
  function resizeCvs(){ cvs.width=innerWidth; cvs.height=innerHeight; }
  window.addEventListener("resize", resizeCvs); resizeCvs();
  function launchConfetti(n){
    const colors=["#ff6b9d","#ff8c42","#ffd23f","#4ecb71","#4a90e2","#9b6bff"];
    for(let i=0;i<(n||80);i++){
      parts.push({ x:randInt(0,cvs.width), y:-20-randInt(0,80), w:randInt(6,12), h:randInt(8,16), color:colors[randInt(0,colors.length-1)], vy:randInt(20,50)/10, vx:(Math.random()-.5)*3, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3 });
    }
    if(!confettiRunning){ confettiRunning=true; requestAnimationFrame(drawConfetti); }
  }
  function drawConfetti(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    parts=parts.filter(p=>p.y<cvs.height+30);
    if(parts.length){ requestAnimationFrame(drawConfetti); }
    else{ confettiRunning=false; ctx.clearRect(0,0,cvs.width,cvs.height); }
  }

  /* ===== 屏幕切换 ===== */
  function showScreen(name){
    resetRuntime();
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    $("screen-"+name).classList.add("active");
    state.screen=name;
    $("btn-home").style.display = (name==="menu") ? "none" : "block";
    $("star-badge").style.display = (name==="menu") ? "flex" : "none";
  }

  /* ===== 星星存档 ===== */
  function loadStars(){
    try{ state.totalStars = parseInt(localStorage.getItem("puzzle_playground_stars")||"0",10)||0; }
    catch(e){ state.totalStars=0; }
    $("totalStars").textContent = state.totalStars;
  }
  function saveStars(){ try{ localStorage.setItem("puzzle_playground_stars", String(state.totalStars)); }catch(e){} }

  /* ===== 结算 ===== */
  function showResult(emoji, stars, msg){
    $("result-emoji").textContent = emoji;
    let html="";
    for(let i=1;i<=3;i++) html += (i<=stars) ? "⭐" : '<span class="off">⭐</span>';
    $("result-stars").innerHTML = html;
    $("result-msg").textContent = msg;
    state.totalStars += stars;
    saveStars(); $("totalStars").textContent = state.totalStars;
    if(stars>=2){ launchConfetti(80 + stars*40); sfx.win(); }
    showScreen("result");
  }

  /* =========================================================
     游戏一：打地鼠
  ========================================================= */
  const MoleGame = {
    score:0, time:30, active:null, running:false, cells:[],
    start(){
      state.currentGame="mole";
      this.score=0; this.time=30; this.active=null; this.running=true;
      $("mole-score").textContent="0"; $("mole-time").textContent="30";
      const grid=$("mole-grid"); grid.innerHTML="";
      this.cells=[];
      for(let i=0;i<9;i++){
        const b=document.createElement("button");
        b.className="mole-hole";
        b.innerHTML='<span class="animal"></span>';
        b.addEventListener("click",()=>this.whack(i));
        grid.appendChild(b);
        this.cells.push(b);
      }
      showScreen("mole");
      setI(()=>{ this.time--; $("mole-time").textContent=this.time; if(this.time<=0) this.end(); }, 1000);
      this.schedulePop();
    },
    schedulePop(){
      if(!this.running) return;
      const delay = Math.max(430, 830 - (30-this.time)*13);
      setT(()=>{ this.pop(); this.schedulePop(); }, delay);
    },
    pop(){
      if(!this.running || this.active) return;
      const idx=randInt(0,8);
      const gold = Math.random()<0.18;
      const cell=this.cells[idx];
      cell.querySelector(".animal").textContent = gold ? "⭐" : "🐹";
      cell.classList.add("up");
      this.active={ idx, gold };
      setT(()=>{
        if(this.active && this.active.idx===idx){
          cell.classList.remove("up");
          this.active=null;
        }
      }, gold?560:820);
    },
    whack(i){
      if(!this.active || this.active.idx!==i) return;
      const gold=this.active.gold;
      this.score += gold?3:1;
      gold?sfx.gold():sfx.pop();
      $("mole-score").textContent=this.score;
      this.cells[i].classList.remove("up");
      this.active=null;
    },
    end(){
      this.running=false;
      const s=this.score;
      const stars = s>=18?3 : s>=8?2 : 1;
      const msg = s>=18?"手速飞快，太厉害了！🏆" : s>=8?"打得真不错！" : "再快一点，你能行！";
      showResult("🔨", stars, "打到 "+s+" 分 · "+msg);
    },
  };

  /* =========================================================
     游戏二：记忆翻牌
  ========================================================= */
  const EMOJIS=["🐶","🐱","🦊","🐼","🐸","🦁","🐵","🐰"];
  const MemoryGame = {
    first:null, moves:0, matched:0, seconds:0, lock:false,
    start(){
      state.currentGame="memory";
      this.first=null; this.moves=0; this.matched=0; this.seconds=0; this.lock=false;
      $("mem-moves").textContent="0"; $("mem-time").textContent="0";
      const grid=$("memory-grid"); grid.innerHTML="";
      shuffle([...EMOJIS,...EMOJIS]).forEach(emo=>{
        const card=document.createElement("div");
        card.className="card"; card.dataset.emo=emo;
        card.innerHTML='<div class="card-inner"><div class="card-face card-back">❓</div><div class="card-face card-front">'+emo+'</div></div>';
        card.addEventListener("click",()=>this.flip(card));
        grid.appendChild(card);
      });
      showScreen("memory");
      setI(()=>{ this.seconds++; $("mem-time").textContent=this.seconds; },1000);
    },
    flip(card){
      if(this.lock||card.classList.contains("flipped")||card.classList.contains("matched")) return;
      sfx.flip(); card.classList.add("flipped");
      if(!this.first){ this.first=card; return; }
      this.moves++; $("mem-moves").textContent=this.moves;
      const a=this.first, b=card;
      if(a.dataset.emo===b.dataset.emo){
        a.classList.add("matched"); b.classList.add("matched");
        this.matched++; sfx.match(); this.first=null;
        if(this.matched===EMOJIS.length) this.finish();
      } else {
        this.lock=true; this.first=null;
        setT(()=>{ a.classList.remove("flipped"); b.classList.remove("flipped"); this.lock=false; },750);
      }
    },
    finish(){
      const total=EMOJIS.length;
      const stars = this.moves<=total+3?3 : this.moves<=total*2?2 : 1;
      const msg = stars===3?"记忆力超强！🐘" : stars===2?"很不错，再快一点更棒！" : "动脑筋想一想，你行的！";
      showResult("🃏", stars, "用了 "+this.seconds+" 秒、翻牌 "+this.moves+" 次 · "+msg);
    },
  };

  /* =========================================================
     游戏三：灯光记忆
  ========================================================= */
  const SimonGame = {
    seq:[], level:0, playerIdx:0, locked:true, tones:[262,330,392,523], btns:[],
    start(){
      state.currentGame="simon";
      this.seq=[]; this.level=0; this.playerIdx=0; this.locked=true;
      this.btns=[...document.querySelectorAll(".simon-btn")];
      $("simon-level").textContent="1";
      $("simon-status").textContent="准备开始";
      showScreen("simon");
      setT(()=>this.nextRound(), 600);
    },
    nextRound(){
      this.level++;
      $("simon-level").textContent=this.level;
      this.seq.push(randInt(0,3));
      this.playerIdx=0; this.locked=true;
      $("simon-status").textContent="看好了…";
      this.seq.forEach((idx,k)=>{
        setT(()=>this.flash(idx), 700 + k*550);
      });
      setT(()=>{ this.locked=false; $("simon-status").textContent="该你啦！"; }, 700 + this.seq.length*550);
    },
    flash(i){
      const b=this.btns[i];
      b.classList.add("on");
      sfx.tone(this.tones[i]);
      setT(()=>b.classList.remove("on"), 360);
    },
    press(i){
      if(this.locked) return;
      this.flash(i);
      if(i !== this.seq[this.playerIdx]){ this.gameover(); return; }
      this.playerIdx++;
      if(this.playerIdx === this.seq.length){
        this.locked=true;
        $("simon-status").textContent="太棒了！";
        setT(()=>this.nextRound(), 850);
      }
    },
    gameover(){
      this.locked=true;
      sfx.gameover();
      const lv=this.level;
      const stars = lv>=7?3 : lv>=4?2 : 1;
      const msg = lv>=7?"记忆力超强！🏆" : lv>=4?"记住得不错哦！" : "再玩一次，会记住更多！";
      showResult("🎵", stars, "记住了 "+lv+" 个灯光 · "+msg);
    },
  };

  /* =========================================================
     游戏四：接水果
  ========================================================= */
  const CatchGame = {
    canvas:null, cctx:null, items:[], basketX:180, score:0, lives:3, time:30,
    running:false, lastT:0, lastSpawn:0, spawnGap:700, speed:2.5,
    FRUITS:["🍎","🍌","🍇","🍓","🍊","🍉","🥝","🍑"],
    start(){
      state.currentGame="catch";
      this.canvas=$("catch-canvas"); this.cctx=this.canvas.getContext("2d");
      this.items=[]; this.score=0; this.lives=3; this.time=30; this.basketX=180;
      this.spawnGap=700; this.speed=2.5; this.lastSpawn=0;
      $("catch-score").textContent="0"; $("catch-lives").textContent="3"; $("catch-time").textContent="30";
      showScreen("catch");
      this.running=true;
      this.lastT=performance.now();
      setI(()=>{ this.time--; $("catch-time").textContent=this.time; if(this.time<=0) this.end(); }, 1000);
      state.raf=requestAnimationFrame(t=>this.loop(t));
    },
    loop(now){
      if(!this.running) return;
      let dt=now-this.lastT; this.lastT=now;
      if(dt>50) dt=50;
      this.lastSpawn+=dt;
      if(this.lastSpawn>=this.spawnGap){
        this.lastSpawn=0;
        this.spawn();
        this.spawnGap=Math.max(380, this.spawnGap*0.985);
        this.speed=Math.min(6, this.speed+0.06);
      }
      this.items.forEach(it=>{ it.y += it.vy; });
      const basketTop=438, basketW=44;
      for(let i=this.items.length-1;i>=0;i--){
        const it=this.items[i];
        if(it.y>basketTop-6 && it.y<basketTop+26 && Math.abs(it.x-this.basketX)<basketW){
          if(it.bomb){
            this.lives--; $("catch-lives").textContent=this.lives; sfx.bomb();
            if(this.lives<=0){ this.end(); return; }
          } else {
            this.score++; $("catch-score").textContent=this.score; sfx.catch();
          }
          this.items.splice(i,1);
        } else if(it.y>486){ this.items.splice(i,1); }
      }
      this.draw();
      state.raf=requestAnimationFrame(t=>this.loop(t));
    },
    spawn(){
      const bomb=Math.random()<0.18;
      this.items.push({
        x:20+Math.random()*320, y:-20,
        vy:this.speed*(0.8+Math.random()*0.5),
        bomb, emoji: bomb?"💣":this.FRUITS[randInt(0,this.FRUITS.length-1)],
      });
    },
    draw(){
      const c=this.cctx;
      c.clearRect(0,0,360,480);
      c.font="34px sans-serif"; c.textAlign="center"; c.textBaseline="middle";
      c.fillText("🧺", this.basketX, 452);
      this.items.forEach(it=>{ c.font="28px sans-serif"; c.fillText(it.emoji, it.x, it.y); });
    },
    moveTo(x){ this.basketX=Math.max(24, Math.min(336, x)); },
    end(){
      this.running=false;
      if(state.raf){ cancelAnimationFrame(state.raf); state.raf=null; }
      const s=this.score;
      const stars = s>=30?3 : s>=15?2 : 1;
      const msg = s>=30?"接水果高手！🏆" : s>=15?"接得真棒！" : "再试试，你能接更多！";
      showResult("🍎", stars, "接住 "+s+" 个水果 · "+msg);
    },
  };

  /* ===== 接水果操作（手指/鼠标/键盘/按钮） ===== */
  const catchCv=$("catch-canvas");
  catchCv.addEventListener("pointermove", e=>{
    if(!CatchGame.running) return;
    const rect=catchCv.getBoundingClientRect();
    CatchGame.moveTo((e.clientX-rect.left)/rect.width*360);
  });
  catchCv.addEventListener("pointerdown", e=>{
    if(!CatchGame.running) return;
    const rect=catchCv.getBoundingClientRect();
    CatchGame.moveTo((e.clientX-rect.left)/rect.width*360);
  });
  let holdDir=null, holdTimer=null;
  function startHold(dir){
    stopHold();
    holdDir=dir;
    holdTimer=setInterval(()=>{ if(CatchGame.running) CatchGame.moveTo(CatchGame.basketX + dir*26); }, 40);
  }
  function stopHold(){ if(holdTimer){ clearInterval(holdTimer); holdTimer=null; } }
  $("catch-left").addEventListener("pointerdown",()=>startHold(-1));
  $("catch-right").addEventListener("pointerdown",()=>startHold(1));
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
    $("catch-left").addEventListener(ev, stopHold);
    $("catch-right").addEventListener(ev, stopHold);
  });
  window.addEventListener("keydown", e=>{
    if(state.screen!=="catch" || !CatchGame.running) return;
    if(e.key==="ArrowLeft") CatchGame.moveTo(CatchGame.basketX-26);
    if(e.key==="ArrowRight") CatchGame.moveTo(CatchGame.basketX+26);
  });

  /* ===== 事件绑定 ===== */
  document.querySelectorAll(".game-card").forEach(card=>{
    card.addEventListener("click",()=>{
      sfx.click();
      const g=card.dataset.game;
      if(g==="random"){ const list=["mole","memory","simon","catch"]; const pick=list[randInt(0,3)];
        if(pick==="mole") MoleGame.start(); else if(pick==="memory") MemoryGame.start(); else if(pick==="simon") SimonGame.start(); else CatchGame.start();
      }
      else if(g==="mole") MoleGame.start();
      else if(g==="memory") MemoryGame.start();
      else if(g==="simon") SimonGame.start();
      else if(g==="catch") CatchGame.start();
    });
  });

  document.querySelectorAll(".simon-btn").forEach(b=>{
    b.addEventListener("click",()=>SimonGame.press(parseInt(b.dataset.i,10)));
  });

  $("btn-home").addEventListener("click",()=>{ sfx.click(); showScreen("menu"); });
  $("btn-replay").addEventListener("click",()=>{
    sfx.click();
    if(state.currentGame==="mole") MoleGame.start();
    else if(state.currentGame==="memory") MemoryGame.start();
    else if(state.currentGame==="simon") SimonGame.start();
    else CatchGame.start();
  });
  $("btn-result-home").addEventListener("click",()=>{ sfx.click(); showScreen("menu"); });

  /* ===== 背景漂浮气泡 ===== */
  const bubbleColors=["#ffd23f","#ff8fb5","#8fd8ff","#9bffb0","#d4b6ff"];
  for(let i=0;i<9;i++){
    const b=document.createElement("div");
    b.className="bubble";
    const s=randInt(20,60);
    b.style.width=s+"px"; b.style.height=s+"px";
    b.style.left=randInt(2,95)+"%";
    b.style.top=randInt(5,90)+"%";
    b.style.background=bubbleColors[i%bubbleColors.length];
    b.style.animationDuration=(6+Math.random()*6)+"s";
    b.style.animationDelay=(-Math.random()*8)+"s";
    document.body.appendChild(b);
  }

  /* ===== 初始化 ===== */
  loadStars();
})();
</script>
<script>
  // 注册离线缓存（PWA），第一次联网打开后即可离线游玩
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.log('Service Worker 注册失败', err);
      });
    });
  }
</script>
</body>
